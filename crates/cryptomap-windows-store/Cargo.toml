[package]
name = "cryptomap-windows-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Opt-in read-only Windows public X.509 store adapter for cryptomap."
readme = "README.md"
include = ["/Cargo.toml", "/src/**", "/examples/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
publish = false

[dependencies]
cryptomap = { path = "../cryptomap", version = "0.1.1-alpha.1", features = ["certificate-store-grants"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem", "std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
