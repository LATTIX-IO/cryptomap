[package]
name = "cryptomap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Evidence-backed cryptographic inventory, observations, and deterministic snapshots."
readme = "README.md"
# Include the exact documented offline fixture, including nested Cargo.lock.
include = ["/Cargo.toml", "/src/**", "/examples/**", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
keywords = ["cryptography", "inventory", "cbom", "security", "pqc"]
categories = ["cryptography", "development-tools", "data-structures"]

# Guard against publishing before conformance and compatibility requirements are complete.
publish = false

[features]
default = []
# Explicit opt-in: AST parser code is not pulled into the core inventory SDK.
rust-source = ["dep:syn", "dep:proc-macro2"]
# No new runtime dependencies: bounded, strict JSON TLS profile only.
json-tls-config = []
# Strict maintained TOML parser, reusing the reviewed B3 profile semantics.
toml-tls-config = ["json-tls-config", "dep:toml", "dep:toml_edit"]
# Passive X.509 file decoder; no signature verification or platform store scanning.
certificate-files = ["dep:x509-cert"]
# Inert, explicitly granted cross-platform certificate-store authorization only.
certificate-store-grants = ["certificate-files"]
# Optional host-keyed X.509 identity hints; no default identity disclosure.
certificate-identity = ["certificate-files", "dep:hmac", "dep:zeroize"]

[[example]]
name = "certificate_store_authorization"
path = "examples/certificate_store_authorization.rs"
required-features = ["certificate-store-grants"]

[[example]]
name = "json_scoped_tls"
path = "examples/json_scoped_tls.rs"
required-features = ["json-tls-config"]

[[example]]
name = "certificate_scoped_inventory"
path = "examples/certificate_scoped_inventory.rs"
required-features = ["certificate-files"]

[[example]]
name = "toml_scoped_tls"
path = "examples/toml_scoped_tls.rs"
required-features = ["toml-tls-config"]

[[example]]
name = "rust_scoped_source"
path = "examples/rust_scoped_source.rs"
required-features = ["rust-source"]

[dependencies]
# RustCrypto structured DER/PEM certificate decoder, no time crate or trust validation.
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem", "std"], optional = true }
# Parser only: disable display, unbounded recursion and preserved ordering.
toml = { version = "=1.1.8", default-features = false, features = ["parse"], optional = true }
# Inspect parsed table syntax rather than brittle raw header text.
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"], optional = true }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"], optional = true }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Already locked by RustCrypto DER: canonical ASN.1 OID validation for imported raw facts.
const-oid = "=0.9.6"
# RustCrypto HMAC-SHA256 with exact 0.10 digest compatibility.
hmac = { version = "=0.12.1", default-features = false, optional = true }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"], optional = true }
cap-std = { version = "4.0.3", default-features = false }
cap-fs-ext = "4.0.3"

[lints]
workspace = true
