name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Deterministic collector robustness/fuzz smoke
        run: cargo test -p cryptomap --test milestone_a_collector_robustness --locked

      - name: Opt-in fault isolation, diagnostics and security regressions
        run: cargo test -p cryptomap --test foss_369_isolation --locked

      - name: Parser-backed Rust source-call integration and security regressions
        run: cargo test -p cryptomap --test foss_370_rust_source --features rust-source --locked

      - name: Bounded JSON TLS configuration and security regressions
        run: cargo test -p cryptomap --test foss_371_json_tls_config --features json-tls-config --locked

      - name: Bounded TOML TLS configuration, replay and security regressions
        run: cargo test -p cryptomap --test foss_372_toml_tls_config --features toml-tls-config --locked

      - name: Passive public X.509 PEM/DER certificate regression and security tests
        run: cargo test -p cryptomap --test foss_406_certificate_files --features certificate-files --locked

      - name: Inert typed X.509 certificate-store authorization security and regression tests
        run: cargo test -p cryptomap --test foss_467_certificate_store_grants --features certificate-store-grants --locked

      - name: B5.3 portable certificate-store source/provider security regressions
        run: cargo test -p cryptomap --test foss_468_certificate_store_backend --features certificate-store-grants --locked

      - name: B5.4 public X.509 profile, privacy and validity regressions
        run: cargo test -p cryptomap --test foss_481_certificate_profile --features certificate-store-grants --locked

      - name: Exact host-scope binding for all built-in Cargo and npm collectors
        run: cargo test -p cryptomap --test foss_371_legacy_scope_binding --locked

      - name: Default library build without optional source parser
        run: cargo check -p cryptomap --no-default-features --locked

      - name: Bounded snapshot finalization/import/diff benchmark smoke
        run: cargo test -p cryptomap --test milestone_a_inventory_scale_smoke --locked -- --nocapture

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify packaged crate
        run: cargo package --package cryptomap --locked

      - name: Clean-room package and reference example
        run: bash scripts/verify-packaged-consumer.sh

      - name: Release artifact evidence tests
        run: python3 -m unittest discover -s scripts -p 'test_release_evidence.py' -v

      - name: Release approval authorization regression tests
        run: python3 -m unittest discover -s scripts -p 'test_publish_gate.py' -v

      - name: Milestone A hands-on Windows release acceptance documentation invariants
        run: python3 -m unittest discover -s scripts -p 'test_windows_manual_validation_guide.py' -v

      - name: Inspect packaged archive and record release evidence
        run: |
          archives=(target/package/cryptomap-*.crate)
          test "${#archives[@]}" -eq 1
          python3 scripts/release_evidence.py \
            --archive "${archives[0]}" \
            --commit "$GITHUB_SHA" \
            --workspace-manifest Cargo.toml \
            --lockfile Cargo.lock \
            --output "target/release-evidence/cryptomap.json"

      - name: Upload release inspection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptomap-release-inspection
          path: target/release-evidence/cryptomap.json
          if-no-files-found: error
          retention-days: 30

      - name: Prepare locked release dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(target/package/cryptomap-*.crate)
          test "${#archives[@]}" -eq 1
          archive_root="$(basename "${archives[0]}" .crate)"
          mkdir -p target/release-evidence/sbom-input
          tar -xOzf "${archives[0]}" "${archive_root}/Cargo.toml" > target/release-evidence/sbom-input/Cargo.toml
          cp Cargo.lock target/release-evidence/sbom-input/Cargo.lock

      - name: Generate SPDX software dependency inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: target/release-evidence/sbom-input
          format: spdx-json
          output-file: target/release-evidence/cryptomap.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Test and validate release dependency inventory
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_sbom.py' -v
          python3 scripts/verify_release_sbom.py target/release-evidence/cryptomap.spdx.json \
            --lockfile target/release-evidence/sbom-input/Cargo.lock

      - name: Upload tested crate and SPDX software inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptomap-tested-crate
          path: target/package/cryptomap-*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Upload SPDX software inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptomap-software-sbom
          path: target/release-evidence/cryptomap.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-semver-checks

      - name: Reject native private-key APIs and preserve safe SDK core
        run: |
          set -euo pipefail
          grep -Fx '#![forbid(unsafe_code)]' crates/cryptomap/src/lib.rs
          forbidden='CryptAcquireCertificatePrivateKey|CertAcquireCertificatePrivateKey|CryptExportKey|NCryptExportKey|PFXExport|CertDeleteCertificateFromStore|NCryptOpenKey|NCryptCreatePersistedKey'
          # Ensure the source guard actually catches the Win32 private-key
          # acquisition/export symbols it is intended to reject.
          for symbol in CryptAcquireCertificatePrivateKey CryptExportKey NCryptExportKey; do
            if ! printf '%s\n' "$symbol" | grep -Eq "$forbidden"; then
              echo "Native API safety guard failed to match expected symbol" >&2
              exit 1
            fi
          done
          if grep -REn "$forbidden" crates/cryptomap-windows-store/src; then
            echo 'Forbidden private-key or destructive Windows certificate API' >&2
            exit 1
          fi

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features

  rust-msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: '1.85.0'
      - name: Verify effective MSRV compiler
        run: |
          rustc +1.85.0 --version
          cargo +1.85.0 --version
          test "$(rustc +1.85.0 --version | cut -d ' ' -f 2)" = "1.85.0"
      - name: MSRV check
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
      - name: MSRV integration tests
        run: cargo +1.85.0 test --workspace --all-features --locked

  rust-windows:
    name: Windows compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: '1.99.0'
      - name: Windows locked compile
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Windows integration tests
        run: cargo test --workspace --all-features --locked
      - name: Native Windows in-memory CryptoAPI conformance
        run: cargo test -p cryptomap-windows-store --locked
      - name: Native Windows Clippy strict
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  release-attestations:
    name: Main-only signed release provenance
    # Never expose an OIDC signing token to arbitrary PR code or fork builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'LATTIX-IO'
    needs: [rust-checks, rust-msrv, rust-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download exact CI-tested release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cryptomap-tested-crate
          path: candidate

      - name: Download validated SPDX inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cryptomap-software-sbom
          path: sbom

      - name: Sign build provenance for tested candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/cryptomap-*.crate

      - name: Sign SPDX SBOM for tested candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: candidate/cryptomap-*.crate
          sbom-path: sbom/cryptomap.spdx.json

      - name: Verify published provenance and SBOM signatures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(candidate/cryptomap-*.crate)
          test "${#candidates[@]}" -eq 1
          # Pin identity as well as the subject digest: same bytes from a
          # different source revision, ref or signer are not sufficient.
          attestation_scope=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            --source-ref refs/heads/main
            --source-digest "$GITHUB_SHA"
          )
          command gh attestation verify "${candidates[0]}" "${attestation_scope[@]}"
          # GitHub CLI defaults to SLSA; verify SPDX separately or the SBOM
          # signature may be missing while the provenance check still passes.
          command gh attestation verify "${candidates[0]}" "${attestation_scope[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3
