name: Temporary FOSS-319 lockfile and format
on:
  pull_request:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/cryptomap/**', '.github/workflows/foss-319-bootstrap.yml']
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/foss-319-scope-authorization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: feature/foss-319-scope-authorization
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Reconcile lockfile and format code
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock crates/cryptomap/src crates/cryptomap/tests
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(FOSS-319): lock capability dependencies and rustfmt source tests"
            git push origin HEAD:feature/foss-319-scope-authorization
          fi
