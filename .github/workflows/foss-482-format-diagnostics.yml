name: B5.5 formatting diagnostics
on:
  push:
    branches: [feature/foss-482-b55-keyed-x509-identity]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Report exact formatting diff
        shell: bash
        run: |
          cargo fmt --all
          git diff -- Cargo.lock crates/cryptomap/src crates/cryptomap/tests
          echo "FORMATTING_DIFF_COMPLETE"
