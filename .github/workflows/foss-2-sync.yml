# Temporary FOSS-2 only; remove before review.
name: FOSS-2 branch format and lockfile
on:
  pull_request:
    branches: [main]
    paths: ['crates/cryptomap/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/foss-2-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/foss-2-canonical-inventory-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/foss-2-canonical-inventory-model
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and lock
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock crates/cryptomap/src crates/cryptomap/tests
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(FOSS-313): format and lock current integration"
            git push origin HEAD:feature/foss-2-canonical-inventory-model
          fi
