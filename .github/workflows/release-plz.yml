name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed main-branch commit SHA (40 lowercase hex)
        required: true
        type: string
      approved_version:
        description: Exact reviewed pre-release version (for example 0.1.1-alpha.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'LATTIX-IO' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.CRYPTOMAP_RELEASE_ENABLED == 'true' && inputs.approved_sha == github.sha }}
    # Administrator must configure cryptomap-publish with required reviewers.
    environment: cryptomap-publish
    concurrency:
      group: cryptomap-publish
      cancel-in-progress: false

    permissions:
      contents: write
      actions: read
      attestations: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: '1.99.0'

      - name: Verify explicit version and successful signed main CI
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=30" > "$RUNNER_TEMP/cryptomap-ci-runs.json"
          python3 -m unittest discover -s scripts -p 'test_publish_gate.py' -v
          ci_run="$(python3 scripts/verify_publish_gate.py \
            --runs-json "$RUNNER_TEMP/cryptomap-ci-runs.json" \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$APPROVED_VERSION" \
            --manifest crates/cryptomap/Cargo.toml \
            --workspace Cargo.toml)"
          echo "ci_run=$ci_run" >> "$GITHUB_OUTPUT"

      - name: Verify exact CI-tested crate and both main attestations
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_CI_RUN: ${{ steps.approval.outputs.ci_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VERIFIED_CI_RUN" --repo "$GITHUB_REPOSITORY" \
            --name cryptomap-tested-crate --dir "$RUNNER_TEMP/cryptomap-candidate"
          shopt -s nullglob
          candidates=("$RUNNER_TEMP"/cryptomap-candidate/cryptomap-*.crate)
          test "${#candidates[@]}" -eq 1
          # Pin identity as well as the subject digest: same bytes from a
          # different source revision, ref or signer are not sufficient.
          attestation_scope=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
            --source-ref refs/heads/main
            --source-digest "$GITHUB_SHA"
          )
          command gh attestation verify "${candidates[0]}" "${attestation_scope[@]}"
          command gh attestation verify "${candidates[0]}" "${attestation_scope[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3
          cargo package --package cryptomap --locked
          packages=(target/package/cryptomap-*.crate)
          test "${#packages[@]}" -eq 1
          cmp "${candidates[0]}" "${packages[0]}"

      - name: Registry dry-run of reviewed version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --dry-run --package cryptomap --locked

      - name: Publish eligible releases
        uses: release-plz/action@d529f731ae3e89610ada96eda34e5c6ba3b12214 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'LATTIX-IO' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: '1.99.0'

      - name: Prepare release PR
        uses: release-plz/action@d529f731ae3e89610ada96eda34e5c6ba3b12214 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
