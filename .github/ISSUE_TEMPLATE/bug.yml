name: Bug report
description: Report a reproducible defect
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or code needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, OS, target, crate version, enabled features, and relevant dependencies.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: If this may be a vulnerability, stop and use Private Vulnerability Reporting instead.
